<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8F8F6" />
    <!-- Pins referrer behavior explicitly rather than relying on the
         browser default (SECURITY_AUDIT.md finding #3) — reset/verify
         links carry a raw token in the query string, and this page loads
         Google Fonts on every load, including the reset page itself. -->
    <meta name="referrer" content="strict-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Anton&display=swap"
      rel="stylesheet"
    />
    <title>Marché — Hire Better. Get Hired Faster.</title>
    <meta
      name="description"
      content="Marché connects event clients with trusted service professionals through a transparent requirement and proposal marketplace."
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('marche-theme');
          document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
