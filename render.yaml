# This file defines the API service only (marche-api). The frontend
# (apps/web) is deployed separately and is not declared here — whatever
# service hosts its built output must have a catch-all rewrite configured:
#
#     /*  ->  /index.html
#
# Required because AppContext's routing (apps/web/src/context/AppContext.tsx)
# uses the History API (pushState/popstate) for deep links like
# /client/jobs/123 — without this rewrite, refreshing or opening such a URL
# directly 404s at the host instead of reaching index.html and letting
# AppContext resolve the route client-side. On a Render Static Site this is
# configured under Settings -> Redirects/Rewrites, not in a repo file.
services:
  - type: web
    name: marche-api
    env: node
    plan: standard

    # Runs from the repo root, not apps/api — this is an npm workspaces
    # monorepo, so `npm ci` and the workspace-scoped builds need the root
    # package-lock.json and node_modules.
    #
    # db:deploy runs `prisma migrate deploy`, never `migrate dev`:
    # migrate dev can prompt, and can reset the database when it detects
    # drift. It must never run against a deployed environment.
    #
    # db:seed populates the category taxonomy and the skill list. Both are
    # reference data the app cannot function without — with no categories,
    # a provider cannot create a service at all. The seed upserts by slug
    # and by name, so running it on every deploy is safe and re-running it
    # never duplicates rows or overwrites categories added by an admin.
    buildCommand: >-
      npm ci &&
      npm run db:generate &&
      npm run db:deploy &&
      npm run db:seed &&
      npm run build -w @marche/db &&
      npm run build -w @marche/api
    startCommand: npm run start -w @marche/api

    healthCheckPath: /categories

    envVars:
      - key: NODE_ENV
        value: production

      # Postgres connection string (Neon). Prisma reads this at runtime and
      # during the migrate/seed steps above.
      #
      # Must include the agreed connection_limit=5 query parameter (e.g.
      # ...?sslmode=require&connection_limit=5) — sized for this service's
      # single `standard` instance plus the brief old+new overlap during a
      # Render rolling deploy, comfortably under Neon's connection ceiling.
      # Set directly in the Render dashboard value for this var (sync: false
      # means it is never committed here) — verify it's present there, this
      # file cannot enforce or confirm it.
      - key: DATABASE_URL
        sync: false

      # Backs rate limiting (see apps/api/src/throttler). Point this at a
      # Render Key Value instance so limits are shared across every API
      # instance and survive redeploys.
      #
      # Required in production: apps/api/src/config/env.validation.ts fails
      # startup when NODE_ENV=production and this is unset — the per-process
      # in-memory fallback isn't acceptable in production (limits aren't
      # shared across instances and reset on every redeploy). Do not deploy
      # this env.validation.ts change until a real Redis instance is
      # provisioned and this value is set, or the next deploy will fail to
      # boot.
      - key: REDIS_URL
        sync: false

      # Signs and verifies access tokens. identity/strategies/jwt.strategy.ts
      # throws on boot if this is missing, so a wrong or absent value fails
      # the deploy loudly rather than silently disabling auth.
      #
      # There is deliberately no refresh-token secret: refresh tokens are
      # random strings stored as hashes in the sessions table, not JWTs.
      - key: JWT_ACCESS_SECRET
        sync: false

      # The one canonical frontend URL, used for every emailed link
      # (verification, reset, invites). No trailing slash. Not the CORS
      # allow-list — see CORS_ORIGINS below for which browser origins may
      # call the API.
      - key: FRONTEND_ORIGIN
        sync: false

      # Comma-separated list of browser origins allowed to call the API with
      # credentials (cookies) — e.g. "https://marche.app,https://staging.marche.app".
      # No trailing slash on any entry. CORS uses credentials, so the browser
      # rejects a wildcard and rejects any mismatch — a trailing slash on an
      # entry here is enough to break every request from that origin.
      - key: CORS_ORIGINS
        sync: false

      # Transactional email for verification and password-reset links.
      # Without SMTP_HOST the links are logged instead of sent, which means
      # nobody can verify their email and therefore nobody can log in.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Powers "Rephrase with AI" on the job-posting form. Without it that
      # one button errors; nothing else on the site depends on it.
      - key: GROQ_API_KEY
        sync: false

      # Required — apps/api/src/payments throws on boot without all three,
      # same as REDIS_URL above. Test-mode keys from the Razorpay dashboard;
      # see apps/api/.env.example for where each one comes from.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: LOG_LEVEL
        value: info
